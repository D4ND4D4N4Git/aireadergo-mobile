<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="aireadergo-version" content="0.4.0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIReaderGO">
<meta name="theme-color" content="#0a1418">
<title>AIReaderGO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0a1418; --panel:#0f1d22; --line:#1d3a42; --text:#dbeef3; --sub:#7f9aa2;
  --accent:#2af5e0; --link:#7fd1ff; --ok:#5fd38d; --ng:#ff7a7a; --warn:#ffcf66;
  --fs:17px; --appH:100vh; --splitL:55%;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@supports (height:100dvh){ :root{--appH:100dvh} }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; height:100%; overflow:hidden; background:#05090b; color:var(--text);
  overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button{font:inherit; color:inherit; cursor:pointer}
button.icon{background:none; border:0; font-size:22px; width:44px; height:44px; flex:none; padding:0}
button.icon.nav{font-size:30px; line-height:1; color:var(--accent)}
button.icon:disabled{opacity:.25}
button.link{background:none; border:0; color:var(--link); font-size:15px; padding:8px; flex:none}

/* ───── アプリの枠：画面に見えている高さぴったり（JS が --appH を設定） ───── */
#app{position:relative; width:100%; height:var(--appH); margin:0 auto; overflow:hidden; overflow:clip; background:var(--bg);
  display:flex; flex-direction:column; touch-action:manipulation}
/* パソコンの画面では、iPhone と同じ幅の縦長の枠で表示する */
body.desk #app{max-width:430px; border-left:1px solid var(--line); border-right:1px solid var(--line)}

#top{flex:none; display:flex; align-items:center; gap:0; padding:var(--safe-t) calc(4px + var(--safe-r)) 0 calc(4px + var(--safe-l));
  min-height:calc(56px + var(--safe-t)); background:var(--panel); border-bottom:1px solid var(--line); z-index:10}
#title{flex:1; min-width:0; text-align:center; line-height:1.3}
#pg{font-weight:700; color:var(--accent); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#sec{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

#stage{flex:1; min-height:0; position:relative; overflow:hidden; overflow:clip}
#summary{position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  overflow-wrap:anywhere; padding:14px calc(16px + var(--safe-r)) 96px calc(16px + var(--safe-l)); font-size:var(--fs); line-height:1.8}
#summary h1,#summary h2,#summary h3,.md h1,.md h2,.md h3{font-size:1.05em; color:var(--accent); margin:.6em 0 .3em}
.md{max-width:100%}
.md table{border-collapse:collapse; display:block; max-width:100%; overflow-x:auto; font-size:.9em; margin:.5em 0}
.md th,.md td{border:1px solid var(--line); padding:4px 8px; white-space:nowrap}
.md ul,.md ol{padding-left:1.3em}
.md pre{white-space:pre-wrap; overflow-x:auto}
.md code{font-size:.92em}
.md img{max-width:100%}
strong{color:#fff}
.empty{color:var(--sub); text-align:center; padding-top:22%; line-height:1.9}

#pdfView{position:absolute; inset:0; background:#000; z-index:5; display:flex; flex-direction:column}
#pdfView[hidden]{display:none}
#pdfBox{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative}
#pdfCanvas{display:block; flex:none; background:#fff}
#pdfCanvas[hidden]{display:none}
#pdfMsg{position:absolute; left:0; right:0; color:var(--sub); font-size:14px; text-align:center; padding:20px}
#pdfMsg:empty{display:none}
#lockBar{flex:none; background:#2b2210; color:var(--warn); font-size:14px; padding:6px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px}
#lockBar[hidden]{display:none}
#lockBar button{background:var(--warn); color:#1a1405; border:0; border-radius:16px; padding:6px 14px; font-weight:700}

#btnOrig{position:absolute; right:calc(14px + var(--safe-r)); bottom:16px; width:64px; height:64px; border-radius:50%;
  background:rgba(42,245,224,.18); border:1.5px solid rgba(42,245,224,.55); color:var(--accent); font-weight:700; font-size:14px;
  z-index:12; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
#btnOrig.on{background:rgba(42,245,224,.35)}
#btnOrig.locked{background:rgba(255,207,102,.35); border-color:var(--warn); color:var(--warn)}
#btnOrig:disabled{opacity:.25}

#handle{flex:none; height:calc(44px + var(--safe-b)); padding-bottom:var(--safe-b); z-index:11; display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--panel); border-top:1px solid var(--line); touch-action:none; cursor:pointer; user-select:none; -webkit-user-select:none}
#handle span{width:56px; height:6px; border-radius:3px; background:#4c7480}
#handle em{font-style:normal; font-size:12px; color:var(--sub)}

/* ───── 下から出るメニュー（アプリの枠の中に収める） ───── */
#sheetShade{position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:29}
#sheetShade[hidden]{display:none}
#sheet{position:absolute; left:0; right:0; bottom:0; height:72%; background:var(--panel); border-top:1px solid var(--line);
  border-radius:16px 16px 0 0; z-index:30; transform:translateY(105%); visibility:hidden;
  transition:transform .22s ease, height .22s ease, visibility 0s linear .22s;
  display:flex; flex-direction:column; padding-bottom:var(--safe-b)}
#sheet.open{transform:translateY(0); visibility:visible; transition:transform .22s ease, height .22s ease}
#sheet.full{height:calc(100% - var(--safe-t) - 10px)}
#sheetHead{flex:none; position:relative; display:flex; align-items:center; padding:14px 8px 6px; border-bottom:1px solid var(--line); touch-action:none}
#sheetHead .grip{position:absolute; top:5px; left:50%; width:44px; height:5px; margin-left:-22px; border-radius:3px; background:#4c7480}
#sheetHead h2{flex:1; min-width:0; text-align:center; font-size:15px; margin:0; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#sheetBack[hidden]{display:inline-block; visibility:hidden}
#sheetBody{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; overflow-wrap:anywhere; -webkit-overflow-scrolling:touch;
  padding:12px calc(14px + var(--safe-r)) 28px calc(14px + var(--safe-l)); font-size:var(--fs); line-height:1.75}

.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.grid button{min-height:54px; border-radius:12px; border:1px solid var(--line); background:#132830; font-size:15px; padding:8px; text-align:center}
.grid button:active{background:#1c3a44}
.grid button.dis{opacity:.35; cursor:default}
.grid .note{grid-column:1/-1; font-size:12px; color:var(--sub); margin:2px 0}
.grid h3{grid-column:1/-1; font-size:13px; color:var(--sub); margin:8px 0 0; font-weight:400}

.choice{display:block; width:100%; text-align:left; margin:6px 0; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#132830; font-size:.95em}
.choice.right{border-color:var(--ok); background:#12301f}
.choice.wrong{border-color:var(--ng); background:#341616}
.result{margin:6px 0 4px; font-weight:700}
.result.ok{color:var(--ok)} .result.ng{color:var(--ng)}
.prev{font-size:12px; color:var(--sub)}
.qbox{border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:12px}
.termlist button{display:block; width:100%; white-space:normal; font-size:inherit; text-align:left; padding:10px 12px; margin:6px 0; border-radius:10px; border:1px solid var(--line); background:#132830}
video,audio{display:block; width:100%; max-height:60%; margin-top:8px; background:#000}
textarea{width:100%; min-height:90px; font-size:16px; background:#0a1418; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px}
.btn{display:inline-block; border:0; border-radius:10px; padding:10px 16px; background:var(--accent); color:#04201c; font-weight:700; font-size:15px}
.btn.sub{background:#23434c; color:var(--text)}
.btn:disabled{opacity:.4}

/* ───── 目次・設定・取り込みの画面（アプリの枠いっぱい） ───── */
#panel{position:absolute; inset:0; background:var(--bg); z-index:40; display:flex; flex-direction:column; padding-top:var(--safe-t)}
#panel[hidden]{display:none}
#panelHead{flex:none; display:flex; align-items:center; padding:8px 12px; min-height:52px; border-bottom:1px solid var(--line)}
#panelHead h2{flex:1; margin:0; font-size:17px; color:var(--accent)}
#panelBody{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  padding:12px calc(16px + var(--safe-r)) calc(30px + var(--safe-b)) calc(16px + var(--safe-l)); font-size:15px; line-height:1.7; overflow-wrap:anywhere}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.row label{flex:1; min-width:8em}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{border:1px solid var(--line); background:#132830; border-radius:8px; padding:6px 10px}
.seg button.on{border-color:var(--accent); color:var(--accent)}
input[type=text],input[type=password],input[type=number]{font-size:16px; background:#0a1418; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; width:100%}
.status{font-size:13px; color:var(--sub)}
.status.ok{color:var(--ok)} .status.ng{color:var(--ng)}
.toc-note{margin:14px 0 4px; color:var(--accent); font-weight:700; font-size:14px}
.toc-sec{display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:9px 4px; font-size:14px}
.toc-sec.cur{background:#132830}
.toc-sec span{color:var(--sub); font-size:12px; margin-left:6px}
.step{border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0}
.step h3{margin:0 0 6px; font-size:15px}
.step .btn{margin-top:6px}
.filebtn{position:relative; overflow:hidden; display:inline-block}
.filebtn input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer}
.progress{height:8px; background:#132830; border-radius:4px; overflow:hidden; margin-top:6px}
.progress div{height:100%; width:0; background:var(--accent); transition:width .2s}
#impMsg{margin-top:12px; font-size:14px; color:var(--text)}
#impMsg.ng{color:var(--ng)}
#impMsg.ok{color:var(--ok)}
body.busy .filebtn, body.busy #delVideo{pointer-events:none; opacity:.4}
#toast{position:absolute; left:50%; bottom:calc(120px + var(--safe-b)); transform:translateX(-50%); background:#22383f; color:var(--text);
  padding:10px 16px; border-radius:20px; font-size:14px; z-index:50; max-width:86%; width:max-content; text-align:center}
#toast[hidden]{display:none}

/* ───── iPad の横向き：左に原本（PDF）、右に要約の2分割（枠の位置は固定） ───── */
body.split #pdfView{right:auto; width:var(--splitL); border-right:1px solid var(--line)}
body.split #summary{left:var(--splitL)}
body.split #handle{margin-left:var(--splitL)}
body.split #sheet, body.split #sheetShade{left:var(--splitL)}
body.split #btnOrig, body.split #lockBar{display:none}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btnToc" class="icon" aria-label="目次">☰</button>
    <button id="btnPrev" class="icon nav" aria-label="前のページ">‹</button>
    <div id="title"><div id="pg">AIReaderGO</div><div id="sec"></div></div>
    <button id="btnNext" class="icon nav" aria-label="次のページ">›</button>
    <button id="btnSettings" class="icon" aria-label="設定">⚙</button>
  </header>

  <div id="stage">
    <main id="summary" tabindex="-1"></main>
    <div id="pdfView" hidden>
      <div id="lockBar" hidden><span>原本を固定中</span><button id="btnUnlock">要約に戻る</button></div>
      <div id="pdfBox"><canvas id="pdfCanvas"></canvas><div id="pdfMsg"></div></div>
    </div>
    <button id="btnOrig" aria-label="原本（押している間だけ表示。ダブルタップで固定）">原本</button>
  </div>

  <div id="handle" role="button" aria-label="メニューを開く"><span></span><em>メニュー</em></div>

  <div id="sheetShade" hidden></div>
  <section id="sheet" aria-hidden="true">
    <div id="sheetHead">
      <span class="grip"></span>
      <button id="sheetBack" class="link" hidden>‹ 戻る</button>
      <h2 id="sheetTitle">メニュー</h2>
      <button id="sheetClose" class="link">閉じる</button>
    </div>
    <div id="sheetBody"></div>
  </section>

  <section id="panel" hidden>
    <div id="panelHead"><h2 id="panelTitle"></h2><button id="panelClose" class="link">閉じる</button></div>
    <div id="panelBody"></div>
  </section>

  <div id="toast" hidden></div>
</div>

<script src="marked.min.js?v=0.4.0"></script>
<script src="pdf.min.js?v=0.4.0"></script>
<script>
/* AIReaderGO モバイル版（iPhone・iPad）
 * 本の内容はこのプログラムに含まない。原本 PDF・問答データ・音声・動画は
 * 利用者が「ファイル」アプリから取り込み、端末の中（IndexedDB）に保存する。
 */
'use strict';
const APP_VERSION = '0.4.0';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
marked.setOptions({ mangle: false, headerIds: false });

// ───────── 保存（IndexedDB） ─────────
const CHUNK = 4 * 1048576;   // 大きなファイルは 4MB ずつに分けて保存する
const DB = {
  db: null,
  open() {
    return new Promise((ok, ng) => {
      if (!window.indexedDB) { ng(new Error('この画面では端末に保存できません（プライベートブラウズでは使えません）')); return; }
      const r = indexedDB.open('aireadergo', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
        if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks');
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => this.db.close(); ok(); };
      r.onerror = () => ng(r.error);
      r.onblocked = () => ng(new Error('別の画面で AIReaderGO が開いています。ほかのタブを閉じてから開き直してください'));
    });
  },
  req(store, mode, fn) {
    return new Promise((ok, ng) => {
      const t = this.db.transaction(store, mode);
      let out;
      const r = fn(t.objectStore(store));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => ok(out);
      t.onerror = () => ng(t.error || (r && r.error));
      t.onabort = () => ng(t.error || new Error('保存が中断されました'));
    });
  },
  get(k) { return this.req('files', 'readonly', (o) => o.get(k)); },
  put(k, v) { return this.req('files', 'readwrite', (o) => { o.put(v, k); }); },
  keys() { return this.req('files', 'readonly', (o) => o.getAllKeys()); },
  range(k) { return IDBKeyRange.bound(k + '#', k + '#￿'); },
  async del(k) {
    await this.req('files', 'readwrite', (o) => { o.delete(k); });
    await this.req('chunks', 'readwrite', (o) => { o.delete(this.range(k)); });
  },
  // ファイルを小分けにして端末に保存する（選んだファイルの中身を実際に読み、端末の中にコピーする）
  async putFile(k, file, meta, onProgress) {
    await this.del(k);
    const type = file.type || meta.type || 'application/octet-stream';
    const n = Math.max(1, Math.ceil(file.size / CHUNK));
    for (let i = 0; i < n; i++) {
      let buf;
      try { buf = await file.slice(i * CHUNK, Math.min(file.size, (i + 1) * CHUNK)).arrayBuffer(); }
      catch (e) { throw readError(e); }
      const part = new Blob([buf], { type });
      await this.req('chunks', 'readwrite', (o) => { o.put(part, k + '#' + String(i).padStart(6, '0')); });
      if (onProgress) onProgress((i + 1) / n);
    }
    await this.put(k, Object.assign({}, meta, { chunked: true, n, size: file.size, type, t: Date.now() }));
  },
  // 保存したファイルを1つのファイルとして取り出す（中身はメモリに読み込まない）
  async getFile(k) {
    const m = await this.get(k);
    if (!m) return null;
    if (m.blob) return Object.assign({}, m);   // 0.2 までの保存形式
    if (!m.chunked) return null;
    const parts = await this.req('chunks', 'readonly', (o) => o.getAll(this.range(k)));
    if (!parts || parts.length !== m.n) throw new Error(`保存したファイルが欠けています（${parts ? parts.length : 0}/${m.n}）。取り込み直してください`);
    const blob = new Blob(parts, { type: m.type });
    if (blob.size !== m.size) throw new Error('保存したファイルの大きさが違います。取り込み直してください');
    return Object.assign({}, m, { blob });
  },
};
function readError(e) {
  return new Error('選んだファイルを読めませんでした。「ファイル」アプリでそのファイルを一度開く（iPhone にダウンロードする）か、' +
    '「このiPhone内」にコピーしてから選び直してください（' + (e && (e.name || e.message)) + '）');
}
function saveError(e) {
  const name = e && (e.name || ''), msg = e && (e.message || '');
  if (name === 'QuotaExceededError' || /quota|space|容量/i.test(msg)) return '端末の空き容量（このアプリの保存できる量）が足りません。動画を減らすか、iPhone の空き容量を増やしてください';
  return msg || name || String(e);
}

// ───────── 設定・記録（端末内） ─────────
const LS = {
  get(k, d) { try { const v = localStorage.getItem('arg.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('arg.' + k, JSON.stringify(v)); } catch (e) {} },
};
const S = Object.assign({
  fontSize: 17, nextBy: 'left', holdMode: 'hold', layout: 'auto', apiKey: '', model: 'claude-sonnet-4-5', page: 27,
}, LS.get('settings', {}));
function saveSettings() { LS.set('settings', S); }

// ───────── 状態 ─────────
const st = {
  data: null,        // 問答データ（companion）
  pdfBlob: null, pdf: null, pdfPages: 0,
  audio: null,       // {blob, index:{"note/pN": [start,end]}}
  videos: {},        // note_id -> true
  pdfNo: S.page,
  locked: false, showingPdf: false,
  rendered: { pdfNo: 0, canvas: null },
  sheetStack: [],
  objectUrls: [],
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = (s) => marked.parse(String(s || ''));
function toast(t, ms = 2200) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (e.hidden = true), ms); }
function revokeUrls() { st.objectUrls.forEach((u) => URL.revokeObjectURL(u)); st.objectUrls = []; }
function objUrl(blob) { const u = URL.createObjectURL(blob); st.objectUrls.push(u); return u; }

// ───────── 取り込み済みデータの読み込み ─────────
async function loadStored() {
  const d = await DB.get('data');
  st.data = d ? d.value : null;
  st.loadErr = '';
  let p = null;
  try { p = await DB.getFile('pdf'); } catch (e) { st.loadErr = '原本 PDF：' + e.message; }
  if (st.pdf) { try { st.pdf.destroy(); } catch (e) {} }
  st.pdfBlob = p ? p.blob : null;
  st.pdf = null; st.pdfErr = ''; st.pdfPages = p ? p.pages : 0;
  st.audio = null;
  try { const a = await DB.getFile('audio'); if (a) st.audio = { blob: a.blob, index: a.index }; } catch (e) { st.loadErr += ' 講義音声：' + e.message; }
  st.videos = {};
  for (const k of await DB.keys()) if (String(k).startsWith('video:')) st.videos[k.slice(6)] = true;
  st.rendered = { pdfNo: 0, canvas: null };
}

// 全体をメモリに読み込まず、必要な部分だけ取り出して PDF.js に渡す
function pdfFromBlob(blob) {
  const transport = new pdfjsLib.PDFDataRangeTransport(blob.size, null);
  transport.requestDataRange = (begin, end) => {
    blob.slice(begin, end).arrayBuffer()
      .then((buf) => transport.onDataRange(begin, new Uint8Array(buf)))
      .catch((e) => { st.pdfErr = '保存した PDF を読めませんでした（' + (e.name || e.message) + '）'; });
  };
  return pdfjsLib.getDocument({ range: transport, length: blob.size, disableAutoFetch: true, disableStream: true,
    rangeChunkSize: 262144, isEvalSupported: false }).promise;
}
let pdfOpening = null;
function openPdf() {
  if (st.pdf || !st.pdfBlob) return Promise.resolve(st.pdf);
  if (!pdfOpening) {
    pdfOpening = pdfFromBlob(st.pdfBlob).then((d) => { st.pdf = d; st.pdfPages = d.numPages; return d; })
      .finally(() => { pdfOpening = null; });
  }
  return pdfOpening;
}

// ───────── ページ ─────────
function maxPage() { return st.pdfPages || (st.data && st.data.pdf_pages) || 736; }
function entry(pdfNo = st.pdfNo) { return st.data ? st.data.pages[String(pdfNo)] : null; }
function noteOf(e) { return e && st.data ? st.data.notes.find((n) => n.note_id === e.note_id) : null; }
function sectionOf(e) {
  const n = noteOf(e); if (!n) return null;
  let hit = null;
  for (const s of n.sections || []) { const [a, b] = s.pages || [0, 0]; if (a <= e.page && e.page <= b) hit = s; }
  return hit;
}
function button(e, id) { return e ? (e.buttons || []).find((b) => b.id === id) : null; }

function goto(pdfNo) {
  pdfNo = Math.max(1, Math.min(maxPage(), pdfNo | 0));
  st.pdfNo = pdfNo; S.page = pdfNo; saveSettings(); st.quizPicked = null;
  renderSummary();
  if (st.showingPdf) renderPdf(); else prerenderPdf();
  if ($('sheet').classList.contains('open')) openMenu();
}

function renderSummary() {
  const e = entry();
  $('pg').textContent = e ? `p.${e.page}（PDF ${st.pdfNo}）` : `PDF ${st.pdfNo}`;
  $('sec').textContent = e ? (e.section || '') : '';
  const box = $('summary');
  if (!st.data) {
    box.innerHTML = `<div class="empty">データがまだありません。<br>右上の ⚙ から「データの取り込み」を開いてください。</div>`;
  } else if (!e) {
    box.innerHTML = `<div class="empty">このページには解説がありません（表紙・目次など）。<br>「原本」を押すと本のページを表示します。</div>`;
  } else {
    const ex = button(e, 'explain');
    box.innerHTML = `<div class="md">${md(ex ? ex.answer : '（解説なし）')}</div>`;
  }
  box.scrollTop = 0;
  $('btnOrig').disabled = !st.pdfBlob;
  $('btnPrev').disabled = st.pdfNo <= 1;
  $('btnNext').disabled = st.pdfNo >= maxPage();
}

// ───────── 原本（PDF）の表示 ─────────
let renderSeq = 0;
// 原本を表示する場所の大きさ（非表示のときも同じ値になるよう、ページ全体の枠から計算する）
function pdfArea() {
  const r = $('stage').getBoundingClientRect();
  const lock = st.locked && !st.split ? ($('lockBar').offsetHeight || 36) : 0;
  return { w: Math.max(100, st.split ? r.width * 0.55 - 1 : r.width), h: Math.max(100, r.height - lock) };
}
function withTimeout(pr, ms, msg) {
  return Promise.race([pr, new Promise((_, ng) => setTimeout(() => ng(new Error(st.pdfErr || msg)), ms))]);
}
async function drawPage(pdfNo, canvas) {
  const pdf = await withTimeout(openPdf(), 30000, 'PDF の読み込みに時間がかかりすぎています');
  if (!pdf || pdfNo > pdf.numPages) return false;
  const page = await pdf.getPage(pdfNo);
  const { w, h } = pdfArea();
  const vp1 = page.getViewport({ scale: 1 });
  const scale = Math.min(w / vp1.width, h / vp1.height);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: scale * dpr });
  canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
  canvas.style.width = Math.floor(vp.width / dpr) + 'px'; canvas.style.height = Math.floor(vp.height / dpr) + 'px';
  canvas.dataset.w = Math.round(w); canvas.dataset.h = Math.round(h);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return true;
}
function refreshPdf() { if (st.showingPdf) renderPdf(); else prerenderPdf(); }
async function prerenderPdf() {
  if (!st.pdfBlob) return;
  const seq = ++renderSeq, no = st.pdfNo;
  const c = document.createElement('canvas');
  try {
    if (await drawPage(no, c) && seq === renderSeq) st.rendered = { pdfNo: no, canvas: c };
  } catch (e) { /* 表示時に再試行 */ }
}
async function renderPdf() {
  const msg = $('pdfMsg'), cv = $('pdfCanvas');
  if (!st.pdfBlob) {
    msg.innerHTML = st.loadErr ? esc(st.loadErr) : '原本の PDF がまだ取り込まれていません。<br>⚙ →「データの取り込み」の 2 から選んでください。';
    cv.hidden = true; return;
  }
  const area = pdfArea();
  const rc = st.rendered.canvas;
  if (st.rendered.pdfNo === st.pdfNo && rc && Math.abs(rc.dataset.w - area.w) < 2 && Math.abs(rc.dataset.h - area.h) < 2) {
    const src = st.rendered.canvas;
    cv.width = src.width; cv.height = src.height; cv.style.width = src.style.width; cv.style.height = src.style.height;
    cv.getContext('2d').drawImage(src, 0, 0); cv.hidden = false; msg.textContent = ''; return;
  }
  msg.textContent = '読み込み中…';
  if (st.rendered.pdfNo !== st.pdfNo) cv.hidden = true;
  try {
    const seq = ++renderSeq;
    const c = document.createElement('canvas');
    const ok = await drawPage(st.pdfNo, c);
    if (seq !== renderSeq) return;
    if (!ok) { msg.textContent = 'このページは PDF にありません。'; cv.hidden = true; return; }
    st.rendered = { pdfNo: st.pdfNo, canvas: c };
    renderPdf();
  } catch (e) {
    cv.hidden = true;
    msg.textContent = 'PDF を表示できませんでした：' + (e.message || e) + '。⚙ →「データの取り込み」で原本 PDF を取り込み直してください。';
    if (st.pdf == null) pdfOpening = null;
  }
}
function showPdf(on) {
  st.showingPdf = on;
  $('pdfView').hidden = !on;
  $('btnOrig').classList.toggle('on', on && !st.locked);
  if (on) renderPdf();
}
function setLock(on) {
  st.locked = on;
  $('lockBar').hidden = !on;
  $('btnOrig').classList.toggle('locked', on);
  showPdf(on);
  toast(on ? '原本の表示を固定しました' : '要約に戻りました', 1400);
}

// 「原本」ボタン：押している間だけ表示。ダブルタップで固定・解除
(function setupOrigButton() {
  const b = $('btnOrig');
  let lastUp = 0, downAt = 0;
  const down = (ev) => {
    ev.preventDefault();
    if (b.disabled) return;
    downAt = Date.now();
    if (!st.locked) {
      if (S.holdMode === 'tap') return;
      showPdf(true);
    }
  };
  const up = (ev) => {
    ev.preventDefault();
    if (b.disabled) return;
    const now = Date.now();
    if (now - lastUp < 320) { lastUp = 0; setLock(!st.locked); return; }
    lastUp = now;
    if (st.locked) return;
    if (S.holdMode === 'tap') {
      // タップで切り替える設定：ダブルタップと区別するため少し待つ
      setTimeout(() => { if (lastUp === now && !st.locked) showPdf(!st.showingPdf); }, 330);
      return;
    }
    showPdf(false);
  };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', () => { if (!st.locked && S.holdMode !== 'tap') showPdf(false); });
  b.addEventListener('contextmenu', (e) => e.preventDefault());
  $('btnUnlock').addEventListener('click', () => setLock(false));
})();

// ───────── 左右のスワイプでページ送り ─────────
function setupSwipe(el) {
  let x0 = 0, y0 = 0, t0 = 0, active = false;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { active = false; return; }
    active = true; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (!active) return; active = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - t0 < 800) {
      const toLeft = dx < 0;
      const next = S.nextBy === 'left' ? toLeft : !toLeft;
      goto(st.pdfNo + (next ? 1 : -1));
    }
  }, { passive: true });
}
setupSwipe($('summary'));
setupSwipe($('pdfView'));
document.addEventListener('keydown', (e) => {
  if ($('panel').hidden === false || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') goto(st.pdfNo + 1);
  if (e.key === 'ArrowLeft') goto(st.pdfNo - 1);
});

const BTN_ORDER = ['formula', 'calc', 'terms', 'compare', 'exam', 'context', 'quiz', 'caution'];
function audioKey(e) { return e ? `${e.note_id}/p${e.page}` : ''; }
function hasAudio(e) { return !!(st.audio && e && st.audio.index[audioKey(e)]); }
const VKIND = { std: { suffix: '', label: '講義動画（通常）', chap: 'video_chapters' },
                easy: { suffix: '_easy', label: '講義動画（高校生向け）', chap: 'video_chapters_easy' } };
function videoKey(e, kind) { return e ? e.note_id + VKIND[kind].suffix : ''; }
function hasVideo(e, kind = 'std') { return !!(e && st.videos[videoKey(e, kind)]); }

function openMenu() {
  st.sheetStack = [openMenu];
  const e = entry();
  if (!st.data) { sheetShow('メニュー', '<p>データがまだありません。⚙ の「データの取り込み」から始めてください。</p>'); return; }
  if (!e) { sheetShow('メニュー', '<p>このページには解説がありません。</p>'); return; }
  const parts = ['<div class="grid">', '<h3>このページ</h3>'];
  for (const id of BTN_ORDER) {
    const b = button(e, id);
    if (b) parts.push(`<button data-act="btn" data-id="${id}">${esc(b.label)}</button>`);
  }
  parts.push('<h3>章・節</h3>');
  parts.push(`<button data-act="overview">この章の全体像</button>`);
  if (sectionOf(e)) parts.push(`<button data-act="section">この節の要点</button>`);
  parts.push('<h3>講義</h3>');
  const ha = hasAudio(e), hv = hasVideo(e, 'std'), he = hasVideo(e, 'easy');
  parts.push(`<button data-act="${ha ? 'audio' : ''}" class="${ha ? '' : 'dis'}" aria-disabled="${!ha}">講義音声</button>`);
  parts.push(`<button data-act="${hv ? 'video' : ''}" data-kind="std" class="${hv ? '' : 'dis'}" aria-disabled="${!hv}">講義動画（通常）</button>`);
  parts.push(`<button data-act="${he ? 'video' : ''}" data-kind="easy" class="${he ? '' : 'dis'}" aria-disabled="${!he}">講義動画（高校生向け）</button>`);
  const miss = [];
  if (!ha) miss.push('講義音声は取り込まれていません。');
  if (!hv && !he) miss.push('このノートの講義動画は保存されていません。');
  else if (!hv) miss.push('通常版の動画は保存されていません。');
  else if (!he) miss.push('高校生向けの動画は保存されていません。');
  if (miss.length) parts.push(`<div class="note">${miss.join('')}</div>`);
  parts.push('<h3>質問</h3>');
  parts.push(`<button data-act="claude">Claude に質問</button>`);
  parts.push('</div>');
  sheetShow('メニュー', parts.join(''));
}

$('sheetBody').addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act; if (!act) return;   // 押せないボタン（灰色）は何もしない
  const e = entry();
  if (act === 'btn') showButton(t.dataset.id);
  else if (act === 'overview') showOverview();
  else if (act === 'section') showSection();
  else if (act === 'audio') showAudio();
  else if (act === 'video') showVideo(t.dataset.kind || 'std');
  else if (act === 'claude') showClaude();
  else if (act === 'term') showTerm(+t.dataset.i);
  else if (act === 'choice') answerQuiz(+t.dataset.q, t.dataset.c);
  else if (act === 'ask') askClaude();
});

function push(fn) { st.sheetStack.push(fn); }
function showButton(id) {
  const e = entry(), b = button(e, id); if (!b) return;
  push(() => showButton(id));
  if (id === 'terms') {

    sheetShow(b.label, `<p class="status">用語を押すと説明が出ます。</p><div class="termlist">${items}</div>`, { full: true, back: true });
  } else if (id === 'quiz') {

  } else {
    sheetShow(b.label, `<div class="md">${md(b.answer)}</div>`, { full: true, back: true });
  }
}
function showTerm(i) {
  const b = button(entry(), 'terms'); const it = b.items[i];
  push(() => showTerm(i));
  sheetShow(it.term, `<div class="md">${md(it.answer)}</div>`, { full: true, back: true });
}
function showOverview() {

function showSection() {

}

// 確認問題（結果は端末に記録）
function quizKey(qi) { return `${st.pdfNo}-${qi}`; }
function quizHtml(e, b) {
  const rec = LS.get('quiz', {});
  return (b.items || []).map((q, qi) => {
    const r = rec[quizKey(qi)], picked = st.quizPicked && st.quizPicked[qi];
    const ch = (q.choices || []).map((c) => {
      const L = c.trim().charAt(0);
      let cls = 'choice';
      if (picked) { if (L === q.answer) cls += ' right'; else if (L === picked) cls += ' wrong'; }
      return `<button class="${cls}" data-act="choice" data-q="${qi}" data-c="${esc(L)}">${esc(c)}</button>`;
    }).join('');
    let res = '';
    if (picked) {
      const ok = picked === q.answer;
      res = `<div class="result ${ok ? 'ok' : 'ng'}">${ok ? '正解です' : '不正解です。正解は ' + esc(q.answer)}</div><div class="md">${md(q.explanation)}</div>`;
    } else if (r) {
      res = `<div class="prev">前回：${r.ok ? '正解' : '不正解'}（${new Date(r.t).toLocaleDateString('ja-JP')}）</div>`;
    }
    return `<div class="qbox"><div><strong>問${qi + 1}</strong> ${md(q.question).replace(/^<p>|<\/p>\s*$/g, '')}</div>${ch}${res}</div>`;
  }).join('');
}
function answerQuiz(qi, letter) {
  const e = entry(), b = button(e, 'quiz');
  st.quizPicked = st.quizPicked || {};
  st.quizPicked[qi] = letter;
  const ok = letter === b.items[qi].answer;
  const rec = LS.get('quiz', {}); rec[quizKey(qi)] = { ans: letter, ok, t: Date.now() }; LS.set('quiz', rec);
  const y = $('sheetBody').scrollTop;
  $('sheetBody').innerHTML = quizHtml(e, b);
  $('sheetBody').scrollTop = y;
}

// 講義音声：音声の zip から、このページの部分だけを取り出して再生
function showAudio() {

  const url = objUrl(st.audio.blob.slice(a, z, 'audio/mpeg'));
  push(showAudio);

}
// 講義動画：このページのチャプター位置から再生
async function showVideo(kind = 'std') {
  const e = entry(); if (!hasVideo(e, kind)) return;
  let v = null;
  try { v = await DB.getFile('video:' + videoKey(e, kind)); } catch (err) { toast(err.message, 5000); return; }
  if (!v) { toast('動画が見つかりません'); return; }
  const n = noteOf(e);
  revokeUrls();
  const chap = n && n[VKIND[kind].chap];
  const start = (chap && chap[String(st.pdfNo)]) || 0;
  const url = objUrl(v.blob);
  push(() => showVideo(kind));
  const where = start ? `p.${e.page} の位置から再生します。` : (chap && Object.keys(chap).length ? 'このページの位置が見つからないため、最初から再生します。' : '問答データにこの動画の位置の情報が無いため、最初から再生します（問答データを作り直すと、ページの位置から再生できます）。');
  sheetShow(VKIND[kind].label, `<p class="status">${esc(n ? n.title : e.note_id)}／${where}</p>
    <video id="vid" controls playsinline preload="metadata" src="${url}"></video>`, { full: true, back: true });
  const vid = $('vid');
  const seek = () => { try { if (start && vid.currentTime < 0.5) vid.currentTime = start; } catch (err) {} };
  vid.addEventListener('loadedmetadata', seek, { once: true });
  vid.addEventListener('play', seek, { once: true });   // iPhone では再生を押すまで読み込まないことがあるため
  if (vid.readyState >= 1) seek();
  vid.addEventListener('error', () => toast('動画を再生できませんでした'), { once: true });
}

// Claude に質問（通信できるときだけ）
function showClaude() {

  const keyNote = S.apiKey ? '' : '<p class="status ng">APIキーが未設定です（⚙ → 設定）。</p>';
  sheetShow('Claude に質問', `${keyNote}<p class="status">表示中のページの解説を根拠として添えて送ります。</p>

const CLAUDE_SYSTEM = 'あなたは証券アナリスト1次試験の学習を助けるアシスタントです。利用者は『パーフェクト 証券アナリスト 第1次レベル』を読んでいます。' +
  '与えた【このページの清書ノート】と【節の要点】を主な根拠に、日本語で短く、結論を先に答えてください。根拠に無い説明を足すときは、その部分の先頭に「補足：」と書いてください。' +
  '数値は本のとおりに使い、計算は途中の式も示してください。回答の最後に、根拠にした印刷ページを (p.X) の形で示してください。';
async function askClaude() {
  const q = ($('q').value || '').trim(); if (!q) return;
  if (!navigator.onLine) { $('ans').innerHTML = '<p class="status ng">オフラインです。通信できるときに質問してください。</p>'; return; }
  const e = entry(), n = noteOf(e), s = sectionOf(e);
  const ctx = [`【本】${st.data.title}`, `【範囲】${n ? n.title : ''}`, `【表示中のページ】印刷 p.${e ? e.page : '-'}（PDF ${st.pdfNo}）｜${e ? e.section : ''}`,
    '【このページの清書ノート】', e ? e.v2 || '' : '', s ? `【節の要点】${s.section} ${s.title}\n${s.answer}` : ''].join('\n');
  $('ans').innerHTML = '<p class="status">考え中…</p>';
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: S.model, max_tokens: 1500, system: CLAUDE_SYSTEM,
        messages: [{ role: 'user', content: `${ctx}\n\n【質問】\n${q}` }] }),
    });
    const d = await r.json();

// zip（無圧縮）の目次を読み、各音声の位置だけを記録する（中身はそのまま保存）
async function readZipIndex(blob) {
  const tailLen = Math.min(blob.size, 65557);
  const tail = new DataView(await blob.slice(blob.size - tailLen).arrayBuffer());
  let eocd = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('zip の目次が見つかりません');
  let count = tail.getUint16(eocd + 10, true), cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
  const cd = new DataView(await blob.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const dec = new TextDecoder();
  const items = [];
  for (let p = 0, i = 0; i < count; i++) {
    if (cd.getUint32(p, true) !== 0x02014b50) throw new Error('zip の形式が違います');
    const method = cd.getUint16(p + 10, true), csize = cd.getUint32(p + 20, true);
    const nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
    const lho = cd.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nlen));
    if (method !== 0 && csize) throw new Error('圧縮された zip は使えません（無圧縮で作ってください）');
    items.push({ name, lho, csize });
    p += 46 + nlen + xlen + clen;
  }
  const index = {};
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (!it.name.endsWith('.mp3')) continue;
    const lh = new DataView(await blob.slice(it.lho, it.lho + 30).arrayBuffer());
    const start = it.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    index[it.name.replace(/\.mp3$/, '')] = [start, start + it.csize];
    if (i % 50 === 0) impMsg(`音声の目次を読んでいます… ${i}/${items.length}`, 0.1 + 0.4 * i / items.length);
  }
  return index;
}
async function importAudio(f) {
  if (!f) return;
  try {
    impMsg('音声の目次を読んでいます…', 0.02);
    let index;
    try { index = await readZipIndex(f); } catch (e) { throw e.name === 'NotReadableError' ? readError(e) : e; }
    const n = Object.keys(index).length; if (!n) throw new Error('音声（mp3）が入っていません');
    await DB.putFile('audio', f, { name: f.name, index, type: 'application/zip' },
      (r) => impMsg(`端末に保存しています… ${(r * 100).toFixed(0)}%（${MB(f.size)}）`, 0.5 + r * 0.5));
    await persist(); await loadStored();
    await openImport(); impMsg(`取り込みました（${n}本）`, 1, 'ok');
  } catch (e) { impMsg('取り込めませんでした：' + saveError(e), 0, 'ng'); }
}
// まとめて取り込む：種類を見分けて、問答データ → 記録 → PDF → 音声 → 動画 の順に処理する
async function importAll(files) {
  if (!files.length) return;
  const json = [], pdf = [], zip = [], mp4 = [], other = [];
  for (const f of files) {
    const n = f.name.toLowerCase();
    if (n.endsWith('.json')) json.push(f); else if (n.endsWith('.pdf')) pdf.push(f);
    else if (n.endsWith('.zip')) zip.push(f); else if (n.endsWith('.mp4')) mp4.push(f); else other.push(f.name);
  }
  const done = [];
  for (const f of json) {
    let kind = '';
    try { const head = JSON.parse(await f.text()); kind = head.format === 'aireadergo-records' ? 'rec' : head.format === 1 && head.pages ? 'data' : ''; } catch (e) {}
    if (kind === 'data') { await importData(f); done.push('問答データ'); }
    else if (kind === 'rec') { if (await importRecords(f, false)) done.push('記録と設定'); }
    else other.push(f.name);
  }
  if (pdf[0]) { await importPdf(pdf[0]); done.push('原本 PDF'); }
  if (zip[0]) { await importAudio(zip[0]); done.push('講義音声'); }
  if (mp4.length) { await importVideos(mp4); done.push(`講義動画 ${mp4.length}本`); }
  await openImport();
  impMsg(`まとめて取り込み：${done.join('、') || 'なし'}${other.length ? '。使えないファイル：' + other.join('、') : ''}`, 1, other.length ? 'ng' : 'ok');
}
async function importVideos(files) {
  if (!files.length) return;
  const ids = st.data ? new Set(st.data.notes.map((n) => n.note_id)) : null;
  let ok = 0; const skipped = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i], id = f.name.replace(/\.mp4$/i, '');
    if (ids && !ids.has(id.replace(/_easy$/, ''))) { skipped.push(f.name + '（名前がノート名と違います）'); continue; }
    try {
      await DB.putFile('video:' + id, f, { name: f.name, type: 'video/mp4' },
        (r) => impMsg(`動画を保存しています… ${i + 1}/${files.length}（${f.name}／${MB(f.size)}） ${(r * 100).toFixed(0)}%`, (i + r) / files.length));
      ok++;
    } catch (e) {
      skipped.push(f.name + '（' + saveError(e) + '）');
      try { await DB.del('video:' + id); } catch (e2) {}
      if (/容量/.test(saveError(e))) break;
    }
  }
  await persist(); await loadStored();
  await openImport();
  impMsg(`${ok}本を保存しました${skipped.length ? '。取り込めなかったもの：' + skipped.join('、') : ''}`, 1, skipped.length ? 'ng' : 'ok');
}

function applyLayout() {

  const autoSplit = TOUCH && W > H && W >= 900;
  const split = S.layout === 'split' ? W >= 700 : S.layout === 'single' ? false : autoSplit;
  const desk = !TOUCH && !split && W > 560;
  const was = st.split;
  st.split = split;
  document.body.classList.toggle('split', split);
  document.body.classList.toggle('desk', desk);
  st.rendered = { pdfNo: 0, canvas: null };

}

(async function start() {
  applySettings();
  try { await DB.open(); await loadStored(); } catch (e) { toast('端末の保存領域を開けませんでした：' + e.message, 5000); }
  applyLayout();
  renderSummary();
  if (!st.data) openImport();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then((r) => r.update()).catch(() => {});
    // 新しい版が入ったら一度だけ読み込み直す（古い部品と新しい部品が混ざらないように）
    // （初めて開いたときは読み込み直さない。取り込みの途中も読み込み直さない）
    let reloaded = false;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded || busy) return; reloaded = true; location.reload();
    });
  }
  let rz = 0;
  const onResize = () => { setAppHeight(); clearTimeout(rz); rz = setTimeout(applyLayout, 200); };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
})();

</script>
</body>
</html>
